name: Gerar APK Android WS Segurança

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar Permissão de Execução ao Gradle
        run: |
          cd android
          chmod +x gradlew || true

      - name: Compilar APK com Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          build-root-directory: android
          arguments: assembleDebug

      - name: Encontrar e Renomear APK
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/WS_Seguranca_v1.0.0.apk
          echo "APK gerado com sucesso!"

      - name: Publicar APK nos Artefatos do GitHub (Download Direto)
        uses: actions/upload-artifact@v4
        with:
          name: WS-Seguranca-APK-v1.0.0
          path: build_output/WS_Seguranca_v1.0.0.apk
          retention-days: 30
