name: Gerar APK Android WS Segurança

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK com Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon




      - name: Encontrar e Renomear APK
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/WS_Seguranca_v1.0.0.apk
          echo "APK gerado com sucesso!"

      - name: Publicar APK nos Artefatos do GitHub (Download Direto)
        uses: actions/upload-artifact@v4
        with:
          name: WS-Seguranca-APK-v1.0.0
          path: build_output/WS_Seguranca_v1.0.0.apk
          retention-days: 30

      - name: Criar/Atualizar Release no GitHub com APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "WS Segurança Residencial v1.0.0 (APK Android)"
          body: |
            ## 📱 Aplicativo Android WS Segurança Residencial
            
            Aplicativo WebView oficial para Android integrado com WhatsApp, atualização rápida e acesso total ao catálogo e painel.
            
            ### ⬇️ Como Instalar:
            1. Baixe o arquivo **`WS_Seguranca_v1.0.0.apk`** abaixo no seu celular Android.
            2. Toque no arquivo baixado e selecione **Instalar** (permita fontes desconhecidas se solicitado).
            3. Pronto! O ícone da **WS Segurança** aparecerá na tela inicial do seu celular.
          files: build_output/WS_Seguranca_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

